- category: PhD students
  name: Pravish Sainath
  image: pravish.jpg
  co-supervisor: Lune Bellec
  content: |
    I'm a PhD student at Université de Montréal. The purpose of my life and study is to better understand the nature and mechanisms of both natural and artificial intelligence. I am mostly interested in using computational and cognitive neuroscience to improve deep and reinforcement learning methods and applying deep learning methods to better understand the brain.
  content_fr: |
    Je suis doctorant à l'Université de Montréal. Le but de ma vie et de mes études est de mieux comprendre la nature et les mécanismes de l'intelligence tant naturelle qu'artificielle. Je m'intéresse principalement à l'utilisation des neurosciences computationnelles et cognitives pour améliorer les méthodes d'apprentissage profond et par renforcement, ainsi qu'à l'application des méthodes d'apprentissage profond pour mieux comprendre le cerveau.

- category: PhD students
  name: Sangnie Bhardwaj
  image: sangnie.jpg
  co-supervisor: Hugo Larochelle
  google-scholar: 0IWgVz4AAAAJ
  content: |
    I'm a PhD student at UdeM and also a researcher at Google Montreal, where I work on building robust and generalizable image representations. I am interested in achieving this by incorporating principles inspired by visual learning in human brains.
  content_fr: |
    Je suis doctorante à l'UdeM et également chercheuse chez Google Montréal, où je travaille à la construction de représentations d'images robustes et généralisables. Je m'intéresse à atteindre cet objectif en incorporant des principes inspirés de l'apprentissage visuel dans le cerveau humain.

- category: PhD students
  name: Sarthak Mittal
  image: sarthak.jpg
  co-supervisor: Yoshua Bengio
  google-scholar: FGGgTrcAAAAJ
  website: https://sarthmit.github.io
  content: |
    I am a PhD student interested in designing unified AI systems that are not constrained to solving a single task but learn general-purpose optimization routines implicitly in their inference mechanism, allowing them to generalize to novel tasks in a few-shot manner. In search of this goal, my explorations revolve around architectural inductive biases and representation learning to encourage compositional computations in Neural Networks as well as generative modeling and Bayesian inference methodologies akin to probabilistic meta-learning setups. A core guiding principle of my work is to efficiently model some crucial invariances underlying a vast majority of tasks, for example optimization procedures, and I believe that leveraging AI systems to model exactly these invariances would lead to few-shot generalization capabilities across novel tasks.
  content_fr: |
    Je suis doctorant et je m'intéresse à la conception de systèmes d'IA unifiés qui ne sont pas limités à la résolution d'une seule tâche, mais qui apprennent implicitement des routines d'optimisation à usage général dans leur mécanisme d'inférence, leur permettant de se généraliser à de nouvelles tâches avec peu d'exemples. Dans cette quête, mes explorations portent sur les biais inductifs architecturaux et l'apprentissage de représentations pour encourager les calculs compositionnels dans les réseaux de neurones, ainsi que sur la modélisation générative et les méthodologies d'inférence bayésienne apparentées aux configurations de méta-apprentissage probabiliste. Un principe directeur central de mon travail est de modéliser efficacement certaines invariances cruciales sous-jacentes à une grande majorité de tâches, par exemple les procédures d'optimisation, et je crois que l'utilisation de systèmes d'IA pour modéliser exactement ces invariances mènerait à des capacités de généralisation avec peu d'exemples à travers de nouvelles tâches.

- category: PhD students
  name: Ximeng Mao
  image: ximeng.jpg
  google-scholar: Q_0TqBgAAAAJ
  content: |
    I am a PhD student in computer science working on machine learning. I am widely interested in applying machine learning and deep learning methods to problems rooted from brain-machine interfaces, and I aim to leverage both deterministic and stochastic models for generic solutions. My current research focuses on meta learning for few-shot adaptation of personalized models and foundation models for neural decoding. My other interests include probabilistic inference, reinforcement learning and medical image analysis.
  content_fr: |
    Je suis doctorant en informatique et je travaille en apprentissage automatique. Je m'intéresse largement à l'application des méthodes d'apprentissage automatique et profond aux problèmes liés aux interfaces cerveau-machine, et je vise à exploiter des modèles déterministes et stochastiques pour des solutions génériques. Ma recherche actuelle porte sur le méta-apprentissage pour l'adaptation avec peu d'exemples de modèles personnalisés et de modèles fondationnels pour le décodage neuronal. Mes autres intérêts incluent l'inférence probabiliste, l'apprentissage par renforcement et l'analyse d'images médicales.

# MSc students

- category: MSc students
  name: Juan David Guerra
  image: juan.jpg
  co-supervisor: Marco Bonizzato
  google-scholar: kUk84YwAAAAJ
  website: https://juandguerra20.github.io
  content: |
    I am an MASc student in Software Engineering interested in the theory and applications of machine learning. My passion lies in developing state-of-the-art learning methods and translating them into impactful tools for healthcare, particularly in the field of neuroscience. I work on optimizing machine learning-driven neurostimulation strategies to support recovery following traumatic spinal cord injury. My current research focuses on the algorithmic development of Gaussian Processes to address the complexity of this problem. Aside from my academic pursuits, I enjoy playing volleyball and exploring a variety of musical instruments.
  content_fr: |
    Je suis étudiant à la maîtrise en génie logiciel, intéressé par la théorie et les applications de l'apprentissage automatique. Ma passion réside dans le développement de méthodes d'apprentissage à la fine pointe et leur traduction en outils ayant un impact sur les soins de santé, en particulier dans le domaine des neurosciences. Je travaille à l'optimisation de stratégies de neurostimulation guidées par l'apprentissage automatique pour soutenir la récupération après une lésion traumatique de la moelle épinière. Ma recherche actuelle porte sur le développement algorithmique de processus gaussiens pour aborder la complexité de ce problème. En dehors de mes activités académiques, j'aime jouer au volleyball et explorer une variété d'instruments de musique.

