# Postdocs

- category: Postdocs
  name: Colin Bredenberg
  image: colin.jpg
  co-supervisor: Blake Richards
  google-scholar: _U-Gw3gAAAAJ
  content: |
    I am a postdoc working in theoretical neuroscience, using mathematical tools from machine learning to understand how learning in the brain works. In particular, I am currently investigating how mice learn, through synaptic plasticity, to control brain-computer interfaces to receive rewards in experimental settings. In my free time, I particularly enjoy creative writing.
  content_fr: |
    Je suis postdoctorant en neurosciences théoriques, utilisant des outils mathématiques issus de l'apprentissage automatique pour comprendre comment l'apprentissage fonctionne dans le cerveau. En particulier, j'étudie actuellement comment les souris apprennent, par plasticité synaptique, à contrôler des interfaces cerveau-machine pour recevoir des récompenses en contexte expérimental. Pendant mon temps libre, j'apprécie particulièrement l'écriture créative.

- category: Postdocs
  name: Ryan Vogt
  image: ryan.jpg
  co-supervisor: Numa Dancause
  google-scholar: P3teu6IAAAAJ
  content: |
    I am a postdoctoral researcher in computational neuroscience interested in the population dynamics of neuronal signals in the brain across different contexts. I develop methods for analyzing the structure of the dynamics in the motor and premotor cortices of non-human primate brains during precision motor tasks. I received my PhD in Applied Mathematics from the University of Washington, for which I characterized the relation between Lyapunov Exponents of RNNs and their performance on and learning of a task. I love to study languages, ride my bike, travel to new countries, and mix cocktails.
  content_fr: |
    Je suis chercheur postdoctoral en neurosciences computationnelles, intéressé par la dynamique populationnelle des signaux neuronaux dans le cerveau à travers différents contextes. Je développe des méthodes pour analyser la structure de la dynamique dans les cortex moteur et prémoteur de cerveaux de primates non humains lors de tâches motrices de précision. J'ai obtenu mon doctorat en mathématiques appliquées à l'Université de Washington, où j'ai caractérisé la relation entre les exposants de Lyapunov des RNN et leur performance et apprentissage d'une tâche. J'aime étudier les langues, faire du vélo, voyager dans de nouveaux pays et préparer des cocktails.

- category: Postdocs
  name: Tom George
  image: tom.jpg
  co-supervisor: Blake Richards
  google-scholar: AG49j3MAAAAJ
  content: |
    I'm a postdoctoral researcher and CNS fellow in computational neuroscience. My research centres on using theoretical techniques and building open-source computational tools to understand the links between neural dynamics and behaviour. I also work on interpretability methods to understand how neural foundation models learn across diverse datasets. In my spare time I girthily struggle to learn French and enjoy being only the second [Tom George](#alumni) to pass through this lab!
  content_fr: |
    Je suis chercheur postdoctoral et fellow CNS en neurosciences computationnelles. Mes travaux portent sur l'utilisation de méthodes théoriques et le développement d'outils computationnels open-source pour appréhender les liens entre dynamique neuronale et comportement. Je travaille également sur des méthodes d'interprétabilité afin de comprendre comment les modèles de fondation neuronaux apprennent à partir de jeux de données variés. Pendant mon temps libre, je m'escrime tant bien que mal à apprendre le français, tout en m’amusant d’être seulement le deuxième [Tom George](#alumni) à passer par ce laboratoire.

# PhD students

- category: PhD students
  name: Abdel Mfougouon Njupoun
  image: abdel.jpg
  co-supervisor: Blake Richards
  google-scholar: SwrG9zQAAAAJ
  website: https://abdelrzk.github.io/abdelnjupoun/
  content: |
    I am a PhD student in Applied Mathematics with a research focus at the intersection of Artificial Intelligence and Neuroscience. I have an interdisciplinary background in Mathematics, Robotics, and Engineering in Robotic Systems. I am passionate about understanding how the brain works and enthusiastic about using mathematics to explore complex systems. I love all kinds of sports, especially soccer. I also love watching documentaries.
  content_fr: |
    Je suis doctorant en mathématiques appliquées avec un axe de recherche à l'intersection de l'intelligence artificielle et des neurosciences. J'ai une formation interdisciplinaire en mathématiques, robotique et ingénierie des systèmes robotiques. Je suis passionné par la compréhension du fonctionnement du cerveau et enthousiaste à l'idée d'utiliser les mathématiques pour explorer des systèmes complexes. J'aime tous les sports, en particulier le soccer. J'aime aussi regarder des documentaires.

- category: PhD students
  name: Avery Hee-Woon Ryoo
  image: avery.jpg
  co-supervisor: Matthew Perich
  google-scholar: W-kRDPYAAAAJ
  website: https://averyryoo.github.io
  content: |
    I am a [mediocre](#tom-george) graduate student passionate about deep generative models, particularly their applications in medicine and science. I aim to use ideas from deep learning, multimodal learning, and dynamical systems theory to design generative frameworks that are faster and more sample-efficient — a crucial step in mitigating the widening resource disparity in an era of increasingly large models. My other interests include neuroprosthetics, in-context learning, the Toronto Raptors, and disagreeing with Nanda on a variety of unimportant topics.
  content_fr: |
    Je suis étudiant aux cycles supérieurs, passionné par les modèles génératifs profonds, en particulier leurs applications en médecine et en science. Mon objectif est d'utiliser des idées issues de l'apprentissage profond, de l'apprentissage multimodal et de la théorie des systèmes dynamiques pour concevoir des cadres génératifs plus rapides et plus efficaces en données — une étape cruciale pour atténuer le fossé croissant des ressources à l'ère des modèles de plus en plus grands. Mes autres intérêts incluent les neuroprothèses, l'apprentissage en contexte, les Raptors de Toronto et le fait de contredire Nanda sur une variété de sujets sans importance.

- category: PhD students
  name: Eric Elmoznino
  image: eric.jpg
  co-supervisor: Yoshua Bengio
  google-scholar: oiRU44UAAAAJ
  website: https://ericelmoznino.github.io
  content: |
    I work at the intersection of artificial intelligence and computational neuroscience, and I'm interested in understanding conscious cognition so that we can close the gap between deep learning and the human mind. While current deep neural networks excel in perceptual domains such as vision, they are unable to perform the kind of higher-order reasoning that in humans is associated with conscious, effortful thought. A core hypothesis motivating my work is that conscious representations are simple, discrete, and, most importantly, compositional. My main projects aim to formalize these elusive concepts, better understand how they work in the brain, and develop deep neural network models of them that are loosely inspired by cognitive science.
  content_fr: |
    Je travaille à l'intersection de l'intelligence artificielle et des neurosciences computationnelles, et je m'intéresse à la compréhension de la cognition consciente afin de combler le fossé entre l'apprentissage profond et l'esprit humain. Bien que les réseaux de neurones profonds actuels excellent dans les domaines perceptuels tels que la vision, ils sont incapables d'effectuer le type de raisonnement d'ordre supérieur qui, chez l'humain, est associé à la pensée consciente et délibérée. Une hypothèse centrale motivant mon travail est que les représentations conscientes sont simples, discrètes et, surtout, compositionnelles. Mes principaux projets visent à formaliser ces concepts insaisissables, à mieux comprendre comment ils fonctionnent dans le cerveau et à développer des modèles de réseaux de neurones profonds librement inspirés des sciences cognitives.

- category: PhD students
  name: Ezekiel (Zeke) Williams
  image: zeke.jpg
  google-scholar: KwgL380AAAAJ
  website: https://computationalcognition.ca
  content: |
    I am an applied math doctoral candidate working to uncover principles underlying learning, memory, and prediction, and how these phenomena arise from electrical dynamics inside the brain. My current work is focused on the role of randomness in neural computation, and how biological cell networks are able to learn even when the information to be learned is spread across long timescales. Given the similarity between models of the brain and AI, my work has some relevance to machine learning. Mathematically, most of my interests lie within dynamical systems theory, probability theory, and statistics. I also enjoy making music, the outdoors, Science for the People, and listening to Rage Against the Machine.
  content_fr: |
    Je suis doctorant en mathématiques appliquées et je travaille à découvrir les principes sous-jacents à l'apprentissage, la mémoire et la prédiction, ainsi que la manière dont ces phénomènes émergent de la dynamique électrique dans le cerveau. Mes travaux actuels portent sur le rôle du hasard dans le calcul neuronal et sur la capacité des réseaux de cellules biologiques à apprendre même lorsque l'information à apprendre est répartie sur de longues échelles temporelles. Étant donné la similarité entre les modèles du cerveau et l'IA, mes travaux ont une certaine pertinence pour l'apprentissage automatique. Mathématiquement, mes intérêts se situent principalement dans la théorie des systèmes dynamiques, la théorie des probabilités et les statistiques. J'aime aussi faire de la musique, le plein air, Science for the People et écouter Rage Against the Machine.

- category: PhD students
  name: Léo Choinière
  image: leo-c.jpg
  co-supervisor: Numa Dancause
  google-scholar: xZFM7j0AAAAJ
  content: |
    I am a PhD student in neuroscience at Université de Montréal. I am interested in brain-machine interfaces, neural dynamics, and motor control. My main project is aimed at optimizing parameters in the context of neurostimulation in preclinical animal models. In general, my research is situated at the intersection of and requires skills from both experimental and computational neuroscience.
  content_fr: |
    Je suis doctorant en neurosciences à l'Université de Montréal. Je m'intéresse aux interfaces cerveau-machine, à la dynamique neuronale et au contrôle moteur. Mon projet principal vise à optimiser les paramètres dans le contexte de la neurostimulation chez des modèles animaux précliniques. De manière générale, ma recherche se situe à l'intersection des neurosciences expérimentales et computationnelles et requiert des compétences dans les deux domaines.

- category: PhD students
  name: Léo Gagnon
  image: leo-g.jpg
  google-scholar: Ira84zwAAAAJ
  content: |
    I am interested in understanding general learning systems such as LLMs in order to contribute to making them better. Specifically, using ideas from meta-learning, Bayesian statistics and other relevant fields, I study foundational models in controlled settings in search of principles relating their pre-training data, mechanisms and architecture. I also like playing the guitar, spending calories, and asking deep questions.
  content_fr: |
    Je m'intéresse à la compréhension des systèmes d'apprentissage généraux tels que les grands modèles de langage afin de contribuer à les améliorer. Plus précisément, en utilisant des idées issues du méta-apprentissage, des statistiques bayésiennes et d'autres domaines pertinents, j'étudie les modèles fondationnels dans des cadres contrôlés à la recherche de principes reliant leurs données de pré-entraînement, leurs mécanismes et leur architecture. J'aime aussi jouer de la guitare, dépenser des calories et poser des questions profondes.

- category: PhD students
  name: Nanda H Krishna
  image: nanda.jpg
  google-scholar: OIdDa5kAAAAJ
  website: https://nandahkrishna.com
  content: |
    I am a PhD student working on problems at the intersection of Computational Neuroscience and Deep Learning. I am specifically interested in developing a theoretical understanding of how learning shapes computation in brains and artificial neural networks. I also work on building foundation models for neuroscience, with the goal of improving decoding in brain-computer interfaces. In my free time, you can find me obsessing over figures, watching cricket, reading comics, or coming up with Korean phrases that annoy Avery.
  content_fr: |
    Je suis doctorant et je travaille sur des problèmes à l'intersection des neurosciences computationnelles et de l'apprentissage profond. Je m'intéresse particulièrement au développement d'une compréhension théorique de la façon dont l'apprentissage façonne le calcul dans les cerveaux et les réseaux de neurones artificiels. Je travaille également à la construction de modèles fondationnels pour les neurosciences, dans le but d'améliorer le décodage dans les interfaces cerveau-ordinateur. Pendant mon temps libre, on me trouve à peaufiner des figures, regarder du cricket, lire des bandes dessinées ou inventer des phrases en coréen qui agacent Avery.

