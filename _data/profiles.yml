- category: MSc students
  name: Tejas Kasetty
  image: tejas.jpg
  co-supervisor: Dhanya Sridhar
  google-scholar: Tg-bMK0AAAAJ
  website: https://tejaskasetty.github.io
  content: |
    I am a graduate student in Computer Science interested in understanding higher-order cognition and building AI systems that replicate them. My current research lies at the intersection of information theory, cognitive neuroscience, and deep learning, exploring compression as a unifying principle underlying various functionalities in biological and artificial systems, from perception to abstract reasoning. I am also interested in developing a mathematical framework that links structural motifs in neural connectivity to functionality through the lens of dynamics. Outside of research, I enjoy chess, climbing, snowboarding, and playing football.
  content_fr: |
    Je suis étudiant aux cycles supérieurs en informatique, intéressé par la compréhension de la cognition d'ordre supérieur et la construction de systèmes d'IA qui les reproduisent. Ma recherche actuelle se situe à l'intersection de la théorie de l'information, des neurosciences cognitives et de l'apprentissage profond, explorant la compression comme principe unificateur sous-jacent à diverses fonctionnalités dans les systèmes biologiques et artificiels, de la perception au raisonnement abstrait. Je m'intéresse également au développement d'un cadre mathématique reliant les motifs structurels de la connectivité neuronale à la fonctionnalité à travers le prisme de la dynamique. En dehors de la recherche, j'apprécie les échecs, l'escalade, le snowboard et le football.

